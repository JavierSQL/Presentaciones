# ----------------------------------------------------------------------
# Misiones con acompañantes propios. Una sublínea sin entrada acá es misión "simple":
# su motivo + relleno. Los acompañantes se agregan con su prob. si el tiquete no es "sola".
#   variantes: alternativas excluyentes dentro de la misión (se elige una por prob.)
# ----------------------------------------------------------------------
misiones:
  - motivo: CEMENTO GRIS
    acompanantes:
      - {sublinea: ARENA Y PIEDRA, prob: 0.25}
      - {sublinea: VARILLA, prob: 0.12}
      - {sublinea: ALBANILERIA, prob: 0.10}
      - {sublinea: BLOCKS, prob: 0.05}

  - motivo: LAMINAS GYPSUM
    acompanantes:
      - {sublinea: TORNILLOS GYPSUM, prob: 0.92}
      - {sublinea: PERFILERIA, prob: 0.85}
      - {sublinea: MASILLA Y CINTA, prob: 0.60}
      - {sublinea: ANCLAJES, prob: 0.30}
      - {sublinea: DISCOS DE CORTE, prob: 0.10}

  - motivo: PERFILERIA
    acompanantes:
      - {sublinea: TORNILLOS GYPSUM, prob: 0.75}
      - {sublinea: ANCLAJES, prob: 0.30}

  - motivo: ACRILICAS
    acompanantes:
      - {sublinea: BROCHAS, prob: 0.45}
      - {sublinea: FELPAS Y RODILLOS, prob: 0.31}
      - {sublinea: MASILLA Y CINTA, prob: 0.08}

  - motivo: ANTICORROSIVOS
    acompanantes:
      - {sublinea: SOLVENTES, prob: 0.59}
      - {sublinea: BROCHAS, prob: 0.40}

  - motivo: PISO CERAMICO
    acompanantes:
      - {sublinea: PEGA PISOS, prob: 0.73}
      - {sublinea: DISCOS DE CORTE, prob: 0.10}

  - motivo: TUBO PVC
    acompanantes:
      - {sublinea: ACCESORIOS PVC, prob: 0.80}
      - {sublinea: PEGAMENTO PVC, prob: 0.60}

  - motivo: TUBO INDUSTRIAL
    acompanantes:
      - {sublinea: SOLDADURA, prob: 0.40}
      - {sublinea: DISCOS DE CORTE, prob: 0.45}
      - {sublinea: ANTICORROSIVOS, prob: 0.20}

  - motivo: TUBO ESTRUCTURAL
    acompanantes:
      - {sublinea: SOLDADURA, prob: 0.40}
      - {sublinea: DISCOS DE CORTE, prob: 0.40}
      - {sublinea: ANTICORROSIVOS, prob: 0.25}

  - motivo: TALADROS
    acompanantes:
      - {sublinea: BROCAS, prob: 0.55}
      - {sublinea: ANCLAJES, prob: 0.25}

  - motivo: DUCHAS
    acompanantes:
      - {sublinea: CABLE ELECTRICO, prob: 0.30}
      - {sublinea: TOMAS E INTERRUPTORES, prob: 0.20}
      - {sublinea: CINTA AISLANTE, prob: 0.25}

  # El Arkenstone. Algunos clientes compran el tablero acá; los carpinteros traen el suyo.
  - motivo: SERV CORTE
    variantes:
      - {nombre: compra_tablero, prob: 0.55, agrega: [{sublinea: TABLEROS MELAMINA, prob: 1.0}]}
      - {nombre: trae_tablero,   prob: 0.45, agrega: []}
    acompanantes:
      - {sublinea: CANTOS, prob: 0.75}
      - {sublinea: TORNILLOS MELAMINA, prob: 0.70}
      - {sublinea: BISAGRAS, prob: 0.60}
      - {sublinea: JALADERAS, prob: 0.45}
      - {sublinea: RIELES, prob: 0.30}
      - {sublinea: PEGAMENTO MADERA, prob: 0.30}

# ----------------------------------------------------------------------
# Pedidos grandes: compras de obra partidas por el POS en facturas de 20 líneas
# que comparten la misma proforma.
# ----------------------------------------------------------------------
pedidos_grandes:
  prob_por_formato: {Tienda: 0.004, Bodega: 0.12}
  lineas: [25, 70]
  departamentos: [CONSTRUCCION, ACERO, FERRETERIA, FONTANERIA, ELECTRICO, PINTURAS]
  cantidad_multiplicador: 2     # una obra compra más unidades por línea

# ----------------------------------------------------------------------
# Clasificación ABC del ERP (heredada; nadie recuerda quién la definió).
#   Productos: Pareto por monto anual por artículo (A hasta 80 %, B hasta 95 %, C el resto).
#   Servicios: siempre C, "porque no tienen inventario".
# ----------------------------------------------------------------------
abc:
  corte_a: 0.80
  corte_b: 0.95
  servicios: C

notes:
  - "TIPO baskets: no lo procesa GeneradorDatosSinteticosPD; lo procesa el notebook de canastas"
  - "SALIDAS: dim_sucursal, dim_articulo, fact_venta_linea, y _validacion_mision (verdad de terreno, NO va al modelo)"
  - "SINTÉTICO: patrones inspirados en un análisis real de retail; ninguna cifra real"
