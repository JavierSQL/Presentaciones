# YAML: ferreteria_canastas.yml
# Charla: La Comunidad del Dato (Comunidad de Data & AI Costa Rica, 2026-11-23)
# Dominio: Retail / ferretería costarricense (ficticia)
#
# Extiende el generador de datos sintéticos (github.com/JavierSQL/GeneradorDatosSinteticos)
# con un tipo de dataset nuevo: "baskets". El generador base arma cada fila independiente;
# acá cada TIQUETE nace de una MISIÓN (el motivo del viaje) que arrastra acompañantes con
# probabilidades. Ese es el conocimiento del mostrador escrito como datos.
#
# Patrones que este YAML planta A PROPÓSITO (los valida el script de prototipo):
#   1. TORNILLOS GYPSUM: lo que más gente lleva, pero casi nunca es el motivo (acompañante masivo).
#   2. CEMENTO GRIS y ACRILICAS: imanes clásicos. La acrílica arrastra brochas y felpas.
#   3. SERVICIO DE CORTE: casi no vende y el ERP lo marca C, pero quien lo usa vino por él
#      y arrastra la canasta más grande (tableros, cantos, herrajes, tornillos).
#   4. PISO CERAMICO -> PEGA PISOS: arrastre fuerte, segundo ejemplo de halo.
#   5. BODEGA CENTRAL: vende a constructoras con pedidos grandes partidos en facturas de 20
#      líneas. Si no se separa por Formato, distorsiona el tráfico de mostrador.
#
# Todo es ficticio: empresa, sucursales, artículos y precios. Sin marcas reales.

dataset:
  name: ferreteria_canastas
  type: baskets
  description: "Un año de tiquetes de una ferretería ficticia con canastas por misión"
  schema: Ferreteria
  output: "Files/Data/Ferreteria"
  seed: 2026
  desde: "2025-01-01"
  hasta: "2025-12-31"
  tiquetes: 500000            # tiquetes de mostrador + pedidos (antes de partir en facturas)
  lineas_por_factura: 20      # el POS corta una compra grande cada 20 líneas
  moneda: CRC
  credito_prob: 0.08          # % de tiquetes de tienda a crédito (en bodega se usa el de la sucursal)
  peso_dia_semana:            # lunes=0 ... domingo=6
    [1.00, 0.95, 0.95, 1.00, 1.10, 1.35, 0.45]

empresa:
  nombre: "Ferretería La Comunidad"

# ----------------------------------------------------------------------
# Sucursales. Formato es el atributo que "nadie mantenía" (causa de ingeniería).
# ----------------------------------------------------------------------
sucursales:
  - {codigo: S01, nombre: "La Comunidad San José Centro", provincia: "San José", formato: Tienda, peso: 0.20}
  - {codigo: S02, nombre: "La Comunidad Heredia",         provincia: "Heredia",  formato: Tienda, peso: 0.17}
  - {codigo: S03, nombre: "La Comunidad Cartago",         provincia: "Cartago",  formato: Tienda, peso: 0.16}
  - {codigo: S04, nombre: "La Comunidad Alajuela",        provincia: "Alajuela", formato: Tienda, peso: 0.16}
  - {codigo: S05, nombre: "La Comunidad Pérez Zeledón",   provincia: "San José", formato: Tienda, peso: 0.11}
  - {codigo: S06, nombre: "La Comunidad Liberia",         provincia: "Guanacaste", formato: Tienda, peso: 0.10}
  - {codigo: B01, nombre: "Bodega Central Constructores", provincia: "Alajuela", formato: Bodega, peso: 0.07,
     credito_prob: 0.65}

# ----------------------------------------------------------------------
# Relleno: líneas sueltas que se agregan a tiquetes que no son de una sola cosa.
# Cantidad ~ Poisson(media). Cada sublínea entra según su peso_relleno.
# ----------------------------------------------------------------------
relleno:
  media_lineas: 1.1

# Flete: acompaña compras grandes; no es una decisión de compra.
flete:
  sublinea: FLETE
  monto_minimo: 150000
  prob: 0.35

# ----------------------------------------------------------------------
# Catálogo: Departamento > Línea > Sublínea > Artículo
#   precio:       [min, max] precio unitario en colones
#   cantidad:     [min, max] unidades por línea
#   articulos:    lista de nombres, o un entero (se generan "<Sublínea> 01..N")
#   peso_mision:  qué tan seguido es el MOTIVO del viaje (relativo)
#   peso_relleno: qué tan seguido se agrega suelta a otra compra (relativo)
#   sola:         prob. de que, cuando es el motivo, el tiquete no traiga nada más
#   tipo:         producto (default) | servicio
# ----------------------------------------------------------------------
catalogo:
  - departamento: CONSTRUCCION
    lineas:
      - linea: CEMENTO
        sublineas:
          - {sublinea: CEMENTO GRIS, precio: [6500, 7500], cantidad: [1, 12], peso_mision: 0.030, peso_relleno: 0.30, sola: 0.45,
             articulos: ["Cemento gris uso general 50 kg", "Cemento gris uso general 25 kg", "Cemento de alta resistencia 50 kg"]}
      - linea: MORTEROS
        sublineas:
          - {sublinea: REPELLOS, precio: [4500, 6000], cantidad: [1, 8], peso_mision: 0.016, peso_relleno: 0.30, sola: 0.30, articulos: 4}
          - {sublinea: PEGA PISOS, precio: [5000, 9000], cantidad: [1, 6], peso_mision: 0.006, peso_relleno: 0.15, sola: 0.40, articulos: 5}
